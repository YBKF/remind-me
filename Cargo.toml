[workspace]
resolver = "2"
members = ["crates/remind_me", "crates/utils"]
default-members = ["crates/remind_me"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
gpui-kit = "0.9"
log = "0.4"
rust-i18n = "4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
utils = { path = "crates/utils" }

[profile.release]
strip = "symbols"
panic = "abort"
